databaseChangeLog:
  - changeSet:
      id: 006-create-equipment-assignments
      author: system
      changes:
        - createTable:
            tableName: equipment_assignments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: equipment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
              - column:
                  name: assigned_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: returned_at
                  type: TIMESTAMP
              - column:
                  name: assigned_by_user_id
                  type: BIGINT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_assignment_equipment_id
            tableName: equipment_assignments
            columns:
              - column:
                  name: equipment_id
        - createIndex:
            indexName: idx_assignment_user_id
            tableName: equipment_assignments
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_assignment_dates
            tableName: equipment_assignments
            columns:
              - column:
                  name: assigned_at
              - column:
                  name: returned_at
        - addForeignKeyConstraint:
            baseTableName: equipment_assignments
            baseColumnNames: equipment_id
            constraintName: fk_assignment_equipment
            referencedTableName: equipment
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment_assignments
            baseColumnNames: user_id
            constraintName: fk_assignment_user
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment_assignments
            baseColumnNames: department_id
            constraintName: fk_assignment_department
            referencedTableName: departments
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment_assignments
            baseColumnNames: assigned_by_user_id
            constraintName: fk_assignment_assigned_by
            referencedTableName: users
            referencedColumnNames: id
