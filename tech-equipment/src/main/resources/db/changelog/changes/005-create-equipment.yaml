databaseChangeLog:
  - changeSet:
      id: 005-create-equipment
      author: system
      changes:
        - createTable:
            tableName: equipment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: current_user_id
                  type: BIGINT
              - column:
                  name: serial_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: inventory_number
                  type: VARCHAR(255)
              - column:
                  name: manufacturer
                  type: VARCHAR(255)
              - column:
                  name: model
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: specifications
                  type: TEXT
              - column:
                  name: purchase_date
                  type: DATE
              - column:
                  name: purchase_price
                  type: DECIMAL(10, 2)
              - column:
                  name: warranty_until
                  type: DATE
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false
              - column:
                  name: condition_status
                  type: VARCHAR(50)
                  defaultValue: GOOD
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_equipment_company_id
            tableName: equipment
            columns:
              - column:
                  name: company_id
        - createIndex:
            indexName: idx_equipment_category_id
            tableName: equipment
            columns:
              - column:
                  name: category_id
        - createIndex:
            indexName: idx_equipment_current_user_id
            tableName: equipment
            columns:
              - column:
                  name: current_user_id
        - createIndex:
            indexName: idx_equipment_status
            tableName: equipment
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_equipment_serial_number
            tableName: equipment
            columns:
              - column:
                  name: serial_number
        - addForeignKeyConstraint:
            baseTableName: equipment
            baseColumnNames: company_id
            constraintName: fk_equipment_company
            referencedTableName: companies
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment
            baseColumnNames: category_id
            constraintName: fk_equipment_category
            referencedTableName: equipment_categories
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment
            baseColumnNames: current_user_id
            constraintName: fk_equipment_current_user
            referencedTableName: users
            referencedColumnNames: id
