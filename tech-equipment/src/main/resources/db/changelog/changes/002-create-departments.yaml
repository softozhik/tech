databaseChangeLog:
  - changeSet:
      id: 002-create-departments
      author: system
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_department_id
                  type: BIGINT
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_department_company_id
            tableName: departments
            columns:
              - column:
                  name: company_id
        - addForeignKeyConstraint:
            baseTableName: departments
            baseColumnNames: company_id
            constraintName: fk_department_company
            referencedTableName: companies
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: departments
            baseColumnNames: parent_department_id
            constraintName: fk_department_parent
            referencedTableName: departments
            referencedColumnNames: id
