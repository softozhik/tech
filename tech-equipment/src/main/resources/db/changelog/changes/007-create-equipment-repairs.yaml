databaseChangeLog:
  - changeSet:
      id: 007-create-equipment-repairs
      author: system
      changes:
        - createTable:
            tableName: equipment_repairs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: equipment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: repair_type
                  type: VARCHAR(50)
              - column:
                  name: cost
                  type: DECIMAL(10, 2)
              - column:
                  name: vendor
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP
              - column:
                  name: reported_by_user_id
                  type: BIGINT
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_repair_equipment_id
            tableName: equipment_repairs
            columns:
              - column:
                  name: equipment_id
        - createIndex:
            indexName: idx_repair_status
            tableName: equipment_repairs
            columns:
              - column:
                  name: status
        - addForeignKeyConstraint:
            baseTableName: equipment_repairs
            baseColumnNames: equipment_id
            constraintName: fk_repair_equipment
            referencedTableName: equipment
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: equipment_repairs
            baseColumnNames: reported_by_user_id
            constraintName: fk_repair_reported_by
            referencedTableName: users
            referencedColumnNames: id
