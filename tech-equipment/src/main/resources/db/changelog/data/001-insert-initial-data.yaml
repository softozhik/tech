              VALUES 
                ((SELECT id FROM companies WHERE name = 'Demo Company'), 
                 (SELECT id FROM departments WHERE name = 'IT Department'),
                 'admin@example.com', 
                 '$2a$12$ZIZWRyJXqD/WxWIJ8tbixuleRt7/9vl6LtDNRkzui8Il238XDCxS2', 
