databaseChangeLog:
  - changeSet:
      id: 001-insert-initial-data
      author: system
      changes:
        - sql:
            sql: |
              INSERT INTO companies (name, description, active, created_at, updated_at)
              VALUES ('Demo Company', 'Демонстрационная компания для тестирования системы', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
        - sql:
            sql: |
              INSERT INTO departments (company_id, name, description, active, created_at, updated_at)
              VALUES 
                ((SELECT id FROM companies WHERE name = 'Demo Company'), 'IT Department', 'IT отдел', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ((SELECT id FROM companies WHERE name = 'Demo Company'), 'Development', 'Отдел разработки', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP),
                ((SELECT id FROM companies WHERE name = 'Demo Company'), 'HR', 'Отдел кадров', true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP);
